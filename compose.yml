services:
  web:
    image: ghcr.io/jhjcpishva/llms-micro-blog-web:0.1.2
    depends_on:
      llms:
        condition: service_started
      pocketbase:
        condition: service_healthy
    ports:
      - "5174:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  llms:
    image: ghcr.io/jhjcpishva/line-login-micro-service:0.1.3
    env_file:
      - .env
    volumes:
      - "./docker/llms/db:/db"
    ports:
      - "8000:8000"
  pocketbase:
    image: ghcr.io/jhjcpishva/llms-micro-blog-pocketbase:0.1.1
    ports:
      - "8090:8090"
    volumes:
      - ./docker/pocketbase/pb_data:/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/api/health || curl -fsS http://127.0.0.1:8090/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
